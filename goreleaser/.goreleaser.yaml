# GoReleaser: https://goreleaser.com/
version: 2

project_name: guesschema

before:
  hooks:
    - go mod download

builds:
  - id: guesschema
    main: ./cmd/guesschema
    binary: guesschema
    dir: .
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s
      - -w
      - -X github.com/Olian04/guesschema/cmd/guesschema/version.Version={{ .Tag }}
      - -X github.com/Olian04/guesschema/cmd/guesschema/version.Revision={{ .Commit }}
      - -X github.com/Olian04/guesschema/cmd/guesschema/version.BuildTime={{ .Env.APP_BUILD_TIME }}

archives:
  - id: guesschema
    formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    ids:
      - guesschema
checksum:
  name_template: checksums.txt

sboms:
  - id: guesschema
    artifacts: binary
    ids:
      - guesschema
    disable: false

changelog:
  use: git
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "(?i)^merge "
      - "(?i)^merge pull request"
      - "^chore\\(release\\):"
      - "^ci:"
      - "^docs:"

release:
  prerelease: auto
  name_template: "{{ .Env.RELEASE_NAME }}"
  header: |
    {{ .Env.RELEASE_BODY }}

  footer: |
    ## Install with the Go toolchain

    **Global binary** (typical):

    ```bash
    go install github.com/Olian04/guesschema/cmd/guesschema@{{ .Tag }}
    ```

    **Pinned in another module** (reproducible, runs via `go tool`):

    ```bash
    go get -tool github.com/Olian04/guesschema/cmd/guesschema@{{ .Tag }}
    go tool github.com/Olian04/guesschema/cmd/guesschema --help
    ```

    Use `@latest` or a semver tag as needed.

    ## Pre-built binaries

    | Asset | Description |
    |-------|-------------|
    | `checksums.txt` | SHA256 checksums for all files in this release |
    | `guesschema_*` | Per-OS/arch binaries (no archive wrapper; raw binary names) |
    | `*.sbom.json` | SPDX JSON SBOM per binary |

    Verify after download (Linux/macOS):

    ```bash
    sha256sum -c checksums.txt
    ```
